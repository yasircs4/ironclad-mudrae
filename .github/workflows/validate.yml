name: Validate portable handback checker
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checker:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.9', '3.12', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Run regression tests
        run: python -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Check the synthetic example
        run: >-
          python scripts/check_handoff.py
          --contract examples/acceptance-contract.json
          --contract-sha256 9ad93e1ebf32a06c629f5c00c7dd1d0d7d849181e0731e39ada0fab129ef0c43
          --manifest examples/submission/handoff-manifest.json
          --root examples/submission
